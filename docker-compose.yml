services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: motor-conteudo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: motor-conteudo-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  n8n:
    image: n8nio/n8n
    container_name: motor-conteudo-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
